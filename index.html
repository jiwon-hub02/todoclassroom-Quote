<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;background:#f5f5f5;color:#333;font-size:14px;line-height:1.5;word-break:keep-all;padding-bottom:90px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px}

.info{background:#fef6e8;border-radius:10px;padding:10px 14px;font-size:13px;color:#555;line-height:1.65}

.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#fafbfc;color:#666;font-weight:600;padding:7px 9px;border-bottom:1px solid #e8e8e8;text-align:left;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
td.n,th.n{text-align:right}td.c,th.c{text-align:center}
tr.total td{background:#fef6e8;font-weight:700;border-bottom:none}
td input{min-width:64px;padding:5px 8px;min-height:32px}
.bd2{display:inline-block;color:#fff;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700}

.kv{display:flex;gap:6px 16px;font-size:13px;color:#555;flex-wrap:wrap}.kv b{color:#1a1a1a}

.page{display:none}.page.active{display:block}

/* 신규 구매 계산기 (camp 견적 계산기와 동일한 구성) */

input.date-input{width:140px;max-width:100%;cursor:pointer;min-height:36px;padding:7px 10px;font-size:14px}
.period-end{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;background:#fef6e8;border-radius:6px;font-size:13px;color:#555}

.calc table{font-size:14px;min-width:540px}.calc .period-section table{min-width:0}
.calc th{font-size:12px;font-weight:500;color:#888;background:none;padding:8px 10px;border-bottom:1px solid #e8e8e8}

.calc td input[type=number].mini{width:60px;padding:6px 4px;font-size:14px;text-align:center;display:block;margin:0 auto;min-height:34px}
.calc select.ps{width:100%;padding:6px 8px;font-size:14px;min-height:36px}
.up{font-size:12px;color:#999;margin-top:2px}.up s{color:#ccc;margin-right:4px}.up b{color:#d14;font-weight:500}
.up .dc{display:inline-block;font-size:10px;color:#fff;background:#d14;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
.rm{padding:4px 8px;font-size:12px;color:#d14;background:none;border:1px solid #f0d0d0;border-radius:4px;white-space:nowrap}
.rm:hover{background:#fef0f0}
.divider td{border-top:1.5px solid #ccc!important;border-bottom:none!important;padding-top:14px!important}
.gtotal{font-size:20px;font-weight:600}
.add-dash{display:block;width:100%;padding:10px;font-size:14px;color:#f5a623;background:#fef6e8;border:1px dashed #f0d8a0;border-radius:8px;text-align:center}
.add-dash:hover{background:#fcecd0}
.cw{border:1px solid #e8e8e8;border-radius:10px;position:relative}
.cw .tblw{overflow-x:auto;overflow-y:visible}
.ct th{font-size:13px;font-weight:600;color:#555;text-align:center;padding:10px 8px;background:#fafbfc}
.ct th:first-child{text-align:left;padding-left:14px}
.thb{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#fff}
.ct td{padding:8px 6px;text-align:center;white-space:nowrap}
.ct td:first-child{text-align:left;padding-left:10px}
.ct td input[type=text]{min-width:90px;padding:6px 8px;font-size:13px;min-height:32px}

.ct td input[type=number]{width:56px;padding:6px 4px;font-size:13px;text-align:center;min-height:32px;display:inline-block}
.stbar{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;background:#fafbfc;border-top:1px solid #e8e8e8}
.sti{display:flex;align-items:center;gap:6px;font-size:13px;color:#555}.sti b{color:#333}
.cfoot{display:flex;justify-content:flex-end;padding:8px 14px;background:#fafbfc;border-top:1px solid #e8e8e8;border-radius:0 0 10px 10px}
.addc{padding:5px 12px;font-size:13px;color:#f5a623;background:#fef6e8;border:1px solid #f0d8a0;border-radius:6px}
.conflict{display:none;padding:10px 14px;font-size:12px;color:#d14;background:#fef0f0;border-top:1px solid #f0d0d0;text-align:center}.conflict.show{display:block}
.vmsg{display:none;text-align:center;font-size:13px;color:#d14;padding:8px;background:#fef0f0;border-radius:6px}.vmsg.show{display:block}
.calendar-popup{position:fixed;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:14px;z-index:60;width:280px;max-width:calc(100vw - 16px);user-select:none;text-align:left}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-h span{font-size:14px;font-weight:600}
.cal-nav{width:28px;height:28px;border:none;background:none;font-size:16px;color:#888;border-radius:6px}.cal-nav:hover{background:#f0f0f0}
.cal-w,.cal-d{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.cal-w span{font-size:11px;color:#aaa;padding:4px 0}
.cal-day{font-size:13px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin:1px auto}
.cal-day:hover{background:#fef6e8}.cal-day.today{background:#fef6e8;color:#f5a623;font-weight:600;border:1.5px solid #f5a623}
.cal-day.sel{background:#f5a623;color:#fff}.cal-day.dis{color:#ccc;pointer-events:none}.cal-day.emp{pointer-events:none}
.cal-x{display:flex;gap:6px;padding:8px 0 0;border-top:1px solid #eee;margin-top:6px}
.cal-x button{flex:1;padding:6px 0;border:1px solid #d0d0d0;border-radius:6px;background:#fff;font-size:12px;color:#555}
.cal-x button.on{border-color:#f5a623;background:#fef6e8;color:#f5a623;font-weight:700}
@media (max-width:560px){h1{font-size:19px}.card{padding:14px}.choice{min-width:100%}}
@media print{body{background:#fff;padding:0}body>*:not(#qdoc){display:none!important}#qdoc{display:block!important;position:static!important;left:0!important}}
</style>

<body>
<div class="testbar">테스트 페이지입니다 · 샘플 데이터만 사용하며, 입력한 정보는 이 브라우저(localStorage)에만 저장되고 외부로 전송되지 않습니다.</div>
<div class="wrap">
<h1>토도 클래스룸 견적 확인하기</h1>
<div class="steps" id="steps"></div>

<!-- ───── 1. 구성 ───── -->
<div class="page" id="p1">
 <div class="card">
  <h2>학교/기관 정보</h2>
  <div class="row" style="align-items:flex-start">
   <div class="fg" style="width:150px"><label>지역</label>
    <select id="region" onchange="onRegion()"><option value="">선택</option></select></div>
   <div class="fg grow" style="position:relative"><label>학교/기관명</label>
    <input type="text" id="school" placeholder="예: 가평초등학교" autocomplete="off" oninput="onSchoolInput()" onfocus="onSchoolInput()">
    <div class="dd" id="dd"></div></div>
  </div>
  <div class="info" id="agree"></div>
  <div class="err" id="schoolErr"></div>
 </div>
 <div class="card">
  <h2>어떤 견적이 필요하신가요?</h2>
  <div class="row" style="align-items:stretch">
   <button class="choice" id="tNew" onclick="setType('new')"><b>신규 구매</b>처음 구매하거나 새 학급을 만들 때</button>
   <button class="choice" id="tEx" onclick="setType('exist')"><b>기존 학급 연장 · 추가</b>이용 중인 학급의 기간을 늘리거나 학생을 추가할 때</button>
  </div>
 </div>
 <div id="secNew" style="display:none"></div>
 <div id="secEx" style="display:none"></div>
</div>

<!-- ───── 2. 견적 내역 ───── -->
<div class="page" id="p2"></div>
<!-- ───── 3. 구매 방법 ───── -->
<div class="page" id="p3"></div>
<!-- ───── 4. 견적서 발급 ───── -->
<div class="page" id="p4"></div>
<!-- ───── 5. 완료 ───── -->
<div class="page" id="p5"></div>
</div>

<div class="fbar" id="fbar"><div class="in"><div id="fsum" class="sub" style="font-size:14px;color:#333"></div><button class="btn o" id="fgo" onclick="go(2)">견적 내역 확인 →</button></div></div>
<div class="toast" id="toast"></div>
<div id="qdoc"></div>

<script>
/* ───────── 샘플 데이터 (실서비스에서는 AC·LMS·통합 DB에서 조회) ───────── */

              {name:'토도영어',short:'영어',code:'202308247014874',edu:'202608039167697',base:20000,ulsan:20000}];
var REGIONS=['서울','경기','강원','울산','전남광주','경북','경남','전북','충북','충남','제주'];

 ['강원','강원춘천초등학교'],['울산','울산태화초등학교'],['울산','울산무거초등학교'],['전남광주','광주빛고을초등학교'],['경북','경북포항초등학교'],
 ['경남','경남창원초등학교'],['전북','전북전주초등학교'],['충북','충북청주초등학교'],['충남','충남천안초등학교'],['제주','제주한라초등학교']];
var ORGS={ // 기관 코드 → 기관/학급 (사용 인원, 이용 시작·종료일)
 'GP1234':{name:'경기가평초등학교',classes:[
  {id:'c1',name:'3학년 1반',subj:{0:{n:25,s:'2026-03-01',e:'2027-02-28'},1:{n:25,s:'2026-03-01',e:'2027-02-28'}}},
  {id:'c2',name:'3학년 2반',subj:{0:{n:10,s:'2026-03-01',e:'2027-02-28'},1:{n:10,s:'2026-03-01',e:'2027-02-28'}}},
  {id:'c3',name:'4학년 1반',subj:{0:{n:20,s:'2026-03-01',e:'2027-02-28'}}},
  {id:'c4',name:'특수학급',subj:{0:{n:5,s:'2025-09-01',e:'2026-08-31'},1:{n:5,s:'2026-03-01',e:'2027-02-28'}}}]},
 'UL5678':{name:'울산태화초등학교',classes:[
  {id:'u1',name:'5학년 1반',subj:{0:{n:22,s:'2026-02-01',e:'2027-01-31'},1:{n:22,s:'2026-02-01',e:'2027-01-31'},2:{n:22,s:'2026-04-01',e:'2027-03-31'}}},
  {id:'u2',name:'5학년 2반',subj:{1:{n:21,s:'2026-02-01',e:'2027-01-31'}}}]}};
var BUDGET_TIMES=['선택 안 함','9:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];

/* ───────── 유틸 ───────── */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function won(n){return Number(n).toLocaleString('ko-KR')+'원'}
function p2(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dot(s){return s.replace(/-/g,'.')}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayAfter(s){var d=parse(s);d.setDate(d.getDate()+1);return iso(d)}
function endOf(start,months){ // 시작일 + N개월 − 1일

   paymentLink:S.purchase==='카드 결제'?'https://pay.example.test/'+('000'+seq).slice(-4):null};
  var all=lsGet(LS_Q,[]);all.push(q);lsSet(LS_Q,all);S.quote=q;go(5)},600)}
